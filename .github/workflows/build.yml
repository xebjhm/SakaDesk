name: CI

on:
  push:
    branches: [main, dev]
    tags: ['v*.*.*']
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4

    # Python linting
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        version: "latest"

    - name: Install Dependencies
      run: uv sync --no-sources

    - name: Lint with ruff
      run: uv run --no-sources ruff check .

    - name: Check formatting with ruff
      run: uv run --no-sources ruff format --check .

    - name: Type Check with mypy
      run: uv run --no-sources mypy backend/

    # Frontend linting
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Frontend Dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Lint Frontend
      working-directory: ./frontend
      run: npm run lint

  test-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        version: "latest"

    - name: Install Dependencies
      run: uv sync --no-sources

    - name: Run Tests with Coverage
      run: |
        uv run --no-sources pytest -v --tb=short \
          --cov=backend --cov-report=term-missing --cov-fail-under=80 \
          --ignore=tests/test_startup.py

  test-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Run Tests with Coverage
      working-directory: ./frontend
      run: npm run test:coverage

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        version: "latest"

    - name: Install Dependencies
      run: uv sync --no-sources

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Frontend Dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Build Frontend
      working-directory: ./frontend
      run: npm run build

    - name: Install Chromium for Playwright
      working-directory: ./frontend
      run: npx playwright install --with-deps chromium

    # The specs need a configured app (is_configured + an output folder) in a
    # throwaway data dir, never a real profile.
    - name: Prepare a configured data dir
      run: |
        mkdir -p "$RUNNER_TEMP/sakadesk-data/out"
        printf '{"is_configured": true, "output_dir": "%s"}' "$RUNNER_TEMP/sakadesk-data/out" > "$RUNNER_TEMP/sakadesk-data/settings.json"
        echo "SAKADESK_DATA_DIR=$RUNNER_TEMP/sakadesk-data" >> "$GITHUB_ENV"

    - name: Run the security e2e specs
      working-directory: ./frontend
      env:
        SAKADESK_E2E_UV_RUN: uv run --no-sources
      run: npx playwright test e2e/csp.spec.ts e2e/launch-auth.spec.ts e2e/entry-flow.spec.ts

    - name: Upload the Playwright report
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: frontend/playwright-report
        retention-days: 7

  build:
    needs: [lint, test-backend, test-frontend, e2e]
    # Tags release; main builds an artifact; a manual run dry-runs the Windows
    # toolchain on any branch (sign, verify-manifest and release run only for
    # pushed tags).
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4

    # Frontend build
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Build Frontend
      working-directory: ./frontend
      run: |
        npm ci
        npm run build

    # Python setup
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        version: "latest"

    - name: Install Dependencies
      run: uv sync --no-sources

    # Pinned for reproducible builds; not in pyproject.toml (build-only tools)
    - name: Install Build Tools
      run: uv pip install pyinstaller==6.13.0 pywebview==5.3.2

    # Build
    - name: Install Inno Setup
      run: choco install innosetup

    - name: Extract Version
      id: version
      run: |
        $version = (uv run --no-sources python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
        echo "VERSION=$version" >> $env:GITHUB_OUTPUT

    # XREPO-02: fail a tagged release build if the tag and the pyproject version
    # disagree. Without this, tagging v0.3.3 while pyproject still says 0.3.2
    # publishes a release titled "0.3.3" carrying SakaDesk-0.3.2-Setup.exe --
    # every installed client detects an update it can never install (the
    # in-app upgrader builds the asset name from the TAG and the lookup fails
    # fleet-wide). Mirrors pysaka's "Verify version matches tag" guard.
    - name: Verify Version Matches Tag
      if: startsWith(github.ref, 'refs/tags/v')
      env:
        # Hardening #5: ref names may contain $(...); never expand them into the script.
        TAG_NAME: ${{ github.ref_name }}
        PKG_VERSION: ${{ steps.version.outputs.VERSION }}
      run: |
        $tagVersion = $env:TAG_NAME -replace '^v', ''
        $pkgVersion = $env:PKG_VERSION
        if ($tagVersion -ne $pkgVersion) {
          Write-Error "Tag version ($tagVersion) does not match pyproject version ($pkgVersion)"
          exit 1
        }
        Write-Host "Version verified: $pkgVersion"

    # XREPO-01: release builds must ship the EXACT pysaka that was tested, not
    # whatever PyPI's newest >=floor happens to be at build time (`uv sync
    # --no-sources` re-resolves from PyPI and ignores the editable sibling +
    # the lock). For a tagged release we therefore require pysaka to be pinned
    # with `==` in pyproject.toml, and we assert the version uv actually
    # resolved matches that pin -- so the artifact is reproducible and a later
    # pysaka release can never silently change an old tag's rebuild.
    - name: Verify pysaka Pinned for Release
      if: startsWith(github.ref, 'refs/tags/v')
      run: uv run --no-sources python tooling/windows/check_release_pin.py

    - name: Build with PyInstaller & Inno Setup
      run: uv run --no-sources python tooling/windows/build_windows.py

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SakaDesk-${{ steps.version.outputs.VERSION }}-Setup
        path: dist/SakaDesk-${{ steps.version.outputs.VERSION }}-Setup.exe

  # Signs the update manifest (Plan E). The key is a secret of the `release`
  # environment, which only v*.*.* tags may use, and this job holds no write
  # token. While the key is present only git, the runner's own python3 (standard
  # library) and OpenSSL run: nothing is installed, because any step in a job can
  # read all of that job's secrets from the runner's memory. Verification runs in
  # `verify-manifest`, which holds no secrets.
  sign:
    needs: [build]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false

    # Hardening #6: release branches merge into main before tagging
    # (CONTRIBUTING.md, Phase 4), so a tag off main is not a release.
    - name: Verify the tag commit is on main
      run: |
        git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
        if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
          echo "::error::the tag commit is not on main"
          exit 1
        fi

    - name: Download Build Artifact
      uses: actions/download-artifact@v4
      with:
        pattern: SakaDesk-*-Setup

    - name: Sign the update manifest
      env:
        SAKADESK_RELEASE_SIGNING_KEY: ${{ secrets.SAKADESK_RELEASE_SIGNING_KEY }}
        SAKADESK_RELEASE_SIGNING_KEY_NEXT: ${{ secrets.SAKADESK_RELEASE_SIGNING_KEY_NEXT }}
      run: |
        TAG_VERSION="${GITHUB_REF_NAME#v}"
        python3 tooling/release/sign_manifest.py \
          --installer "SakaDesk-${TAG_VERSION}-Setup/SakaDesk-${TAG_VERSION}-Setup.exe" \
          --version "$TAG_VERSION" \
          --out "SakaDesk-${TAG_VERSION}-manifest.json"

    - name: Upload the signed manifest
      uses: actions/upload-artifact@v4
      with:
        name: SakaDesk-manifest
        path: SakaDesk-*-manifest.json
        if-no-files-found: error

  # The app's own verifier against this release's keys and the previous
  # release's keys, in a job with no secrets: a release that installed clients
  # could not verify is never published.
  verify-manifest:
    needs: [build, sign]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    # Full history and tags: the previous-release check uses `git describe`.
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Download Build Artifact
      uses: actions/download-artifact@v4
      with:
        pattern: SakaDesk-*-Setup

    - name: Download the signed manifest
      uses: actions/download-artifact@v4
      with:
        name: SakaDesk-manifest

    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        version: "latest"

    # The app's own verifier and keys: a key the released app does not trust
    # would make every later update fail, so stop before publishing.
    - name: Verify the manifest with the new release's keys
      run: |
        TAG_VERSION="${GITHUB_REF_NAME#v}"
        uv run --no-project --with "cryptography==46.0.3" python -m backend.services.release_signing \
          --manifest "SakaDesk-${TAG_VERSION}-manifest.json" \
          --installer "SakaDesk-${TAG_VERSION}-Setup/SakaDesk-${TAG_VERSION}-Setup.exe" \
          --version "$TAG_VERSION"

    # Installed clients run the previous release, so its keys must verify too
    # (key rotation safety, Plan E Decision 6). Fails closed: only a previous
    # tag below the first signed release may skip. The variable is for one
    # emergency only: a lost key (CONTRIBUTING.md, "Release signing").
    - name: Verify the manifest with the previous release's keys
      if: vars.SAKADESK_ALLOW_KEY_RESET != 'yes'
      env:
        # The first release that ships the verifier (Plan E D-6); tags below it
        # trust no key.
        FIRST_SIGNED_VERSION: "0.5.0"
      run: |
        set -euo pipefail
        TAG_VERSION="${GITHUB_REF_NAME#v}"
        if ! PREV_TAG="$(git describe --tags --abbrev=0 --match 'v*.*.*' "${GITHUB_SHA}^")" || [ -z "$PREV_TAG" ]; then
          echo "::error::cannot determine the previous release tag"
          exit 1
        fi
        PREV_VERSION="${PREV_TAG#v}"
        LOWEST="$(printf '%s\n%s\n' "$PREV_VERSION" "$FIRST_SIGNED_VERSION" | sort -V | sed -n 1p)"
        if [ "$PREV_VERSION" != "$FIRST_SIGNED_VERSION" ] && [ "$LOWEST" = "$PREV_VERSION" ]; then
          echo "::notice::the previous release ($PREV_TAG) is below $FIRST_SIGNED_VERSION and trusts no signing key"
          exit 0
        fi
        if ! git show "${PREV_TAG}:backend/services/release_keys.py" > "$RUNNER_TEMP/previous_release_keys.py"; then
          echo "::error::backend/services/release_keys.py is missing at $PREV_TAG"
          exit 1
        fi
        uv run --no-project --with "cryptography==46.0.3" python -m backend.services.release_signing \
          --manifest "SakaDesk-${TAG_VERSION}-manifest.json" \
          --installer "SakaDesk-${TAG_VERSION}-Setup/SakaDesk-${TAG_VERSION}-Setup.exe" \
          --version "$TAG_VERSION" \
          --keys-file "$RUNNER_TEMP/previous_release_keys.py"

  release:
    needs: [build, sign, verify-manifest]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Download Build Artifact
      uses: actions/download-artifact@v4
      with:
        pattern: SakaDesk-*-Setup

    - name: Download the signed manifest
      uses: actions/download-artifact@v4
      with:
        name: SakaDesk-manifest

    # XREPO-02 / XREPO-09: the in-app upgrader looks up the release assets by the
    # exact names SakaDesk-<tag-without-v>-Setup.exe and -manifest.json
    # (backend/services/release_signing.py). Assert both exist before publishing.
    - name: Verify Release Asset Names
      run: |
        TAG_VERSION="${GITHUB_REF_NAME#v}"
        for f in "SakaDesk-${TAG_VERSION}-Setup/SakaDesk-${TAG_VERSION}-Setup.exe" "SakaDesk-${TAG_VERSION}-manifest.json"; do
          if [ ! -f "$f" ]; then
            echo "Error: expected release asset $f not found. Contents:"
            find . -maxdepth 2 -name 'SakaDesk-*' -type f
            exit 1
          fi
        done
        echo "Release assets verified for ${TAG_VERSION}"

    - name: Generate SHA-256 Checksums
      run: |
        TAG_VERSION="${GITHUB_REF_NAME#v}"
        (cd "SakaDesk-${TAG_VERSION}-Setup" && sha256sum "SakaDesk-${TAG_VERSION}-Setup.exe") > checksums-sha256.txt
        sha256sum "SakaDesk-${TAG_VERSION}-manifest.json" >> checksums-sha256.txt
        cat checksums-sha256.txt

    - name: Attest Build Provenance
      uses: actions/attest-build-provenance@v2
      with:
        subject-path: |
          SakaDesk-*-Setup/*.exe
          SakaDesk-*-manifest.json

    # Draft first, publish once every asset is attached: required when the
    # repository has immutable releases on (assets lock at publication).
    - name: Create GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        TAG_VERSION="${GITHUB_REF_NAME#v}"
        gh release create "$GITHUB_REF_NAME" \
          "SakaDesk-${TAG_VERSION}-Setup/SakaDesk-${TAG_VERSION}-Setup.exe" \
          "SakaDesk-${TAG_VERSION}-manifest.json" \
          checksums-sha256.txt \
          --draft \
          --verify-tag \
          --title "SakaDesk ${TAG_VERSION}" \
          --generate-notes
        gh release edit "$GITHUB_REF_NAME" --draft=false --latest
