name: CI

on:
  push:
    branches: [main, dev]
    tags: ['v*.*.*']
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4

    # Python linting
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        version: "latest"

    - name: Install Dependencies
      run: uv sync --no-sources

    - name: Lint with ruff
      run: uv run --no-sources ruff check .

    - name: Check formatting with ruff
      run: uv run --no-sources ruff format --check .

    - name: Type Check with mypy
      run: uv run --no-sources mypy backend/

    # Frontend linting
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Frontend Dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Lint Frontend
      working-directory: ./frontend
      run: npm run lint

  test-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        version: "latest"

    - name: Install Dependencies
      run: uv sync --no-sources

    - name: Run Tests with Coverage
      run: |
        uv run --no-sources pytest -v --tb=short \
          --cov=backend --cov-report=term-missing --cov-fail-under=80 \
          --ignore=tests/test_startup.py

  test-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Run Tests with Coverage
      working-directory: ./frontend
      run: npm run test:coverage

  build:
    needs: [lint, test-backend, test-frontend]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4

    # Frontend build
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Build Frontend
      working-directory: ./frontend
      run: |
        npm ci
        npm run build

    # Python setup
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        version: "latest"

    - name: Install Dependencies
      run: uv sync --no-sources

    # Pinned for reproducible builds; not in pyproject.toml (build-only tools)
    - name: Install Build Tools
      run: uv pip install pyinstaller==6.13.0 pywebview==5.3.2

    # Build
    - name: Install Inno Setup
      run: choco install innosetup

    - name: Extract Version
      id: version
      run: |
        $version = (uv run --no-sources python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
        echo "VERSION=$version" >> $env:GITHUB_OUTPUT

    # XREPO-02: fail a tagged release build if the tag and the pyproject version
    # disagree. Without this, tagging v0.3.3 while pyproject still says 0.3.2
    # publishes a release titled "0.3.3" carrying SakaDesk-0.3.2-Setup.exe --
    # every installed client detects an update it can never install (the
    # in-app upgrader builds the asset name from the TAG and the lookup fails
    # fleet-wide). Mirrors pysaka's "Verify version matches tag" guard.
    - name: Verify Version Matches Tag
      if: startsWith(github.ref, 'refs/tags/v')
      run: |
        $tagVersion = "${{ github.ref_name }}" -replace '^v', ''
        $pkgVersion = "${{ steps.version.outputs.VERSION }}"
        if ($tagVersion -ne $pkgVersion) {
          Write-Error "Tag version ($tagVersion) does not match pyproject version ($pkgVersion)"
          exit 1
        }
        Write-Host "Version verified: $pkgVersion"

    # XREPO-01: release builds must ship the EXACT pysaka that was tested, not
    # whatever PyPI's newest >=floor happens to be at build time (`uv sync
    # --no-sources` re-resolves from PyPI and ignores the editable sibling +
    # the lock). For a tagged release we therefore require pysaka to be pinned
    # with `==` in pyproject.toml, and we assert the version uv actually
    # resolved matches that pin -- so the artifact is reproducible and a later
    # pysaka release can never silently change an old tag's rebuild.
    - name: Verify pysaka Pinned for Release
      if: startsWith(github.ref, 'refs/tags/v')
      run: uv run --no-sources python tooling/windows/check_release_pin.py

    - name: Build with PyInstaller & Inno Setup
      run: uv run --no-sources python tooling/windows/build_windows.py

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SakaDesk-${{ steps.version.outputs.VERSION }}-Setup
        path: dist/SakaDesk-${{ steps.version.outputs.VERSION }}-Setup.exe

  release:
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
    - uses: actions/checkout@v4

    - name: Download Build Artifact
      uses: actions/download-artifact@v4
      with:
        pattern: SakaDesk-*-Setup

    # XREPO-02 / XREPO-09: the in-app upgrader looks up the release asset by the
    # exact name SakaDesk-<tag-without-v>-Setup.exe (upgrade_service.
    # _installer_asset_name). Assert the built artifact carries that exact name
    # before publishing, so a packaging rename (e.g. adding -x64) can never ship
    # an unlisted asset that every client fails to download.
    - name: Verify Installer Asset Name
      run: |
        TAG_VERSION="${GITHUB_REF_NAME#v}"
        EXPECTED="SakaDesk-${TAG_VERSION}-Setup.exe"
        if [ ! -f "SakaDesk-${TAG_VERSION}-Setup/${EXPECTED}" ]; then
          echo "Error: expected installer asset ${EXPECTED} not found. Contents:"
          find SakaDesk-*-Setup -type f
          exit 1
        fi
        echo "Installer asset verified: ${EXPECTED}"

    - name: Generate SHA-256 Checksums
      run: |
        cd SakaDesk-*-Setup
        sha256sum *.exe > ../checksums-sha256.txt
        cat ../checksums-sha256.txt

    - name: Attest Build Provenance
      uses: actions/attest-build-provenance@v2
      with:
        subject-path: SakaDesk-*-Setup/*.exe

    - name: Create GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release create "$GITHUB_REF_NAME" \
          SakaDesk-*-Setup/*.exe \
          checksums-sha256.txt \
          --title "SakaDesk $(echo $GITHUB_REF_NAME | sed 's/^v//')" \
          --generate-notes
